name: 意見・不具合の報告
description: QUAKEへの意見、まちがいの報告、ほしい機能など
title: "[意見] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        **ここに書いた内容は、誰でも見られる場所に公開されます。**
        名前、住所、学校、電話番号、メールアドレス、顔が写った写真など、個人が分かることは書かないでください。
        地震や津波の緊急の連絡には使えません。今の情報は気象庁で確認してください。
        セキュリティの問題は、ここに書かずに「Security」タブの非公開の報告から知らせてください。
  - type: dropdown
    id: kind
    attributes:
      label: 種類
      options:
        - 意見・感想
        - 表示のまちがい
        - ほしい機能
        - その他
    validations:
      required: true
  - type: textarea
    id: body
    attributes:
      label: 内容
      description: 表示のまちがいなら、見た日時と、どの地震の表示かを書いてください。
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 確認
      options:
        - label: 個人が分かることを書いていません
          required: true
