<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QUAKE 案内ページ</title>
  <meta name="description" content="QUAKEの地震情報が表示できないときの案内です。公式の情報を確認してください。">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <style>
    :root { color-scheme: light dark; --bg: #f6f7f5; --ink: #172f32; --muted: #506368; --line: #d2dcd8; --accent: #00695c; --notice: #e7efeb; }
    @media (prefers-color-scheme: dark) { :root { --bg: #101c1e; --ink: #edf4ef; --muted: #b0c2bf; --line: #354b4a; --accent: #8ce0ca; --notice: #203a35; } }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif; line-height: 1.8; }
    main { width: min(720px, calc(100% - 32px)); margin: 0 auto; padding: 32px 0 48px; }
    h1 { font-size: 1.5rem; margin: 0 0 16px; }
    .notice { background: var(--notice); border: 1px solid var(--line); border-radius: 10px; padding: 14px 18px; }
    ul { list-style: none; margin: 20px 0; padding: 0; display: grid; gap: 10px; }
    a { display: flex; align-items: center; min-height: 44px; padding: 8px 14px; border: 1px solid var(--accent); border-radius: 8px; color: var(--accent); font-weight: 600; text-decoration: none; }
    a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    small { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>QUAKEの地震情報を表示できません</h1>
    <p class="notice"><strong>これは地震情報そのものではありません。</strong>QUAKEの表示が止まっているときの案内です。揺れを感じたら、まず身の安全を確保してください。</p>
    <p>下の公式の情報を確認してください。</p>
    <ul>
      <li><a href="https://www.jma.go.jp/bosai/map.html#contents=earthquake_map">気象庁の地震情報 ↗</a></li>
      <li><a href="https://www.jma.go.jp/bosai/map.html#contents=tsunami">気象庁の津波情報 ↗</a></li>
      <li><a href="http://www.kmoni.bosai.go.jp/">今の揺れを見る（防災科研 強震モニタ）↗</a></li>
    </ul>
    <p><small>QUAKEは緊急地震速報ではありません。表示が遅れたり止まったりすることがあります。</small></p>
  </main>
</body>
</html>
